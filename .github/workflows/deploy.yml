name: Deploy to Ubuntu server

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  diagnose:
    name: Read-only HTTPS diagnosis
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect HTTPS configuration
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          port: ${{ vars.SSH_PORT }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -eu
            nginx -t
            python3 - <<'PYREMOTE'
            import subprocess
            config = subprocess.run(['nginx', '-T'], capture_output=True, text=True, check=True).stdout
            prefixes = ('# configuration file ', 'listen ', 'server_name ', 'ssl_certificate ', 'ssl_certificate_key ', 'proxy_pass ', 'return ', 'root ', 'include ')
            for line in config.splitlines():
                stripped = line.strip()
                if stripped.startswith(prefixes):
                    print(stripped)
            PYREMOTE
            ls -l /etc/nginx/sites-enabled/
            if command -v certbot >/dev/null 2>&1; then
              certbot certificates
            fi
            systemctl is-active gestionale-gunicorn.service
