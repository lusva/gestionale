# Gestionale CRM — nginx davanti a gunicorn (127.0.0.1:8001).
#
# Certificato: certbot (Let's Encrypt), es.
#   certbot certonly --webroot -w /var/www/certbot -d gestionale.aigislab.ai
# Se il dominio cambia, aggiorna server_name e i percorsi ssl_certificate*.

# Statici: i file con l'hash del contenuto nel nome (collectstatic con
# gestionale.storage.StaticConHash) non cambiano mai → cache di un anno;
# gli altri un'ora, così un deploy non lascia in giro CSS/JS vecchi.
map $uri $gestionale_static_cache {
    "~*\.[0-9a-f]{12}\.[a-z0-9]+$"  "public, max-age=31536000, immutable";
    default                          "public, max-age=3600";
}

# HTTP → HTTPS (tranne la sfida ACME di certbot)
server {
    listen 80;
    listen [::]:80;
    server_name gestionale.aigislab.ai;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx >= 1.25.1: meglio «listen 443 ssl;» + «http2 on;»
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gestionale.aigislab.ai;

    ssl_certificate     /etc/letsencrypt/live/gestionale.aigislab.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gestionale.aigislab.ai/privkey.pem;
    # generati da certbot; se mancano, commentali
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 50M;

    # Compressione di pagine, CSS, JS e JSON (il default di nginx comprime
    # solo text/html).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml
               text/plain application/xml text/xml;

    location /static/ {
        alias /opt/gestionale-crm/staticfiles/;
        add_header Cache-Control $gestionale_static_cache;
        access_log off;
    }

    # Media sensibili: mai serviti direttamente.
    # Il .p12 della firma digitale (chiave privata) non si scarica via web.
    location ^~ /media/certificati/ {
        deny all;
        return 404;
    }

    # Allegati rimborsi, XML e PDF/scansioni delle fatture di acquisto: passano da Django
    # (login + permesso, gestionale/media_views.py), che risponde con
    # X-Accel-Redirect verso /media-protetti/.
    location ~ ^/media/(rimborsi_km|fatture_acquisto_xml|fatture_acquisto_allegati)/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media-protetti/ {
        internal;
        alias /opt/gestionale-crm/media/;
        add_header Cache-Control "private, no-store";
        add_header X-Content-Type-Options nosniff;
    }

    # Il resto dei media (logo, avatar) è pubblico.
    location /media/ {
        alias /opt/gestionale-crm/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120;
        proxy_connect_timeout 120;
        proxy_send_timeout 120;
    }
}
