{# Render via {% barchart values labels %} (core_settings/templatetags/ui.py), che calcola bars e yaxis. #}
<div class="chart">
  <div class="chart-yaxis">
    {% for y in yaxis %}<span>{{ y }}</span>{% endfor %}
  </div>
  <div class="chart-grid"><div></div><div></div><div></div><div></div></div>
  <div class="chart-bars">
    {% for b in bars %}
      <div class="bar" style="height: {{ b.pct }}%;" title="{{ b.label }}: {{ b.valore|euro_compact }}"></div>
    {% endfor %}
  </div>
  <div class="chart-xaxis">
    {% for l in labels %}<span>{{ l }}</span>{% endfor %}
  </div>
</div>
